spring:
  application:
    name: supplysync-backend
  config:
    # 프로젝트 루트의 .env를 읽는다. 없으면 OS 환경변수만 사용한다 (docker compose와 같은 파일)
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:supplysync}
    username: ${DB_USER:supplysync_app}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway만 변경한다. Hibernate는 엔티티와 일치하는지 검증만 한다
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_AMQP_PORT:5672}
    username: ${RABBITMQ_USER:supplysync}
    password: ${RABBITMQ_PASSWORD}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  # /internal/** 호출 시 X-Internal-Api-Key 헤더와 비교할 값 (검증 로직은 인증 단계에서 추가)
  internal-api-key: ${INTERNAL_API_KEY}
