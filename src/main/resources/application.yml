spring:
  application:
    name: supplysync-backend
  config:
    # 프로젝트 루트의 .env를 읽는다. 없으면 OS 환경변수만 사용한다 (docker compose와 같은 파일)
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:supplysync}?sslmode=${DB_SSLMODE:disable}&currentSchema=${DB_SCHEMA:public}
    username: ${DB_USER:supplysync_app}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway만 변경한다. Hibernate는 엔티티와 일치하는지 검증만 한다
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Supabase public 스키마에는 기본 객체가 이미 있다. 앱 테이블이 없는 새 프로젝트에서만 사용한다.
    baseline-on-migrate: ${DB_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 0
  jackson:
    # API JSON은 데이터셋 정답지(05_expected)와 같은 snake_case로 통일한다 (Agent·MCP·프론트가 같은 필드명을 쓴다)
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_AMQP_PORT:5672}
    username: ${RABBITMQ_USER:supplysync}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        default-requeue-rejected: false
        prefetch: 1
        concurrency: 2

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  messaging:
    # 기본은 RabbitMQ(outbox → 큐 → 소비자)로 Agent 실행·재개 명령을 전달한다. false로 끄면 개발용으로 Agent HTTP를 직접 호출한다
    enabled: ${ANALYSIS_MQ_ENABLED:true}
    # false면 Spring은 outbox 발행·큐 선언만 하고 소비하지 않는다 (Agent가 analysis.request.q를 직접 소비할 때)
    consumer-enabled: ${ANALYSIS_MQ_CONSUMER_ENABLED:true}
    # Agent 호출이 실패했을 때 다시 시도하는 횟수. 0이면 한 번만 호출하고 실패하면 작업을 FAILED로 처리한다
    request-retries: ${ANALYSIS_REQUEST_RETRIES:0}
  # Agent 팀과 공유. /internal/** 수신과 Spring → Agent HTTP 호출에 같은 헤더를 사용한다.
  internal-api-key: ${INTERNAL_API_KEY}
  watchdog:
    # Agent 이벤트가 끊긴 작업을 FAILED로 바꾼다. 사람 입력 대기 상태는 대상이 아니다
    enabled: ${WATCHDOG_ENABLED:true}
    interval-ms: ${WATCHDOG_INTERVAL_MS:60000}
    queued-minutes: ${WATCHDOG_QUEUED_MINUTES:10}
    active-minutes: ${WATCHDOG_ACTIVE_MINUTES:30}
  # 업로드된 RFQ 원문 파일을 두는 디렉터리. rfqs.file_path는 이 디렉터리 기준 상대 경로이다
  rfq-files-dir: ${RFQ_FILES_DIR:./rfq-files}
  agent:
    # Agent 팀 계약 확정 후 설정. 비어 있으면 작업은 QUEUED로 남는다.
    base-url: ${AGENT_BASE_URL:}
    # Agent 응답을 기다리는 최대 시간(초). 이 시간 안에 응답이 없으면 호출 실패로 보고 작업을 FAILED로 처리한다
    read-timeout-seconds: ${AGENT_READ_TIMEOUT_SECONDS:300}
  jwt:
    secret-base64: ${JWT_SECRET_BASE64:}
    issuer: ${JWT_ISSUER:supplysync}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:3600}
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:}
